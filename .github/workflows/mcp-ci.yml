name: GammaLedger MCP — CI

on:
  pull_request:
    paths:
      - "mcp/**"
      - ".github/workflows/mcp-ci.yml"
  push:
    branches: [main]
    paths:
      - "mcp/**"
      - ".github/workflows/mcp-ci.yml"

permissions:
  contents: read

concurrency:
  group: mcp-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Checks (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    env:
      # Keep `uv sync` and every later `uv run` on the matrix interpreter; otherwise
      # uv follows mcp/.python-version, recreates the venv and drops the dev extras.
      UV_PYTHON: ${{ matrix.python-version }}
    defaults:
      run:
        working-directory: mcp

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: mcp/uv.lock

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Lint (ruff)
        run: uv run python -m ruff check src tests scripts

      - name: Format check (ruff)
        run: uv run python -m ruff format --check src tests scripts

      - name: Type check (mypy)
        run: uv run python -m mypy src

      - name: Run tests
        run: uv run python -m pytest tests/ -v

  # Install the built wheel WITHOUT the lockfile, as `uvx gammaledger-mcp` would,
  # so an upstream dependency break (e.g. a new major of `mcp`) fails here first.
  package:
    name: Build and smoke-test wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Build
        working-directory: mcp
        run: uv build
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: "0.0.0"

      - name: Check package metadata
        working-directory: mcp
        run: uvx twine check --strict dist/*

      - name: Smoke-test the wheel in a clean environment
        run: |
          set -euo pipefail
          WHEEL="$(ls mcp/dist/*.whl)"
          uv venv --python 3.12 "$RUNNER_TEMP/smoke"
          uv pip install --python "$RUNNER_TEMP/smoke/bin/python" "${WHEEL}"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/smoke/bin/python" "$GITHUB_WORKSPACE/mcp/scripts/smoke_installed.py" \
            --expect-version "0.0.0"
