name: GammaLedger MCP — Release & Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      version:
        description: "MCP package version (for example, 1.2.3 or mcp-1.2.3)"
        required: true
        type: string
      release_notes:
        description: "Release notes (leave blank to auto-generate from commits)"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: mcp-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  # ── 1. Pre-publish checks ────────────────────────────────────────────────────
  test:
    name: Pre-publish checks (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    env:
      # Keep `uv sync` and every later `uv run` on the matrix interpreter; otherwise
      # uv follows mcp/.python-version, recreates the venv and drops the dev extras.
      UV_PYTHON: ${{ matrix.python-version }}
    defaults:
      run:
        working-directory: mcp

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: mcp/uv.lock

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Lint (ruff)
        run: uv run python -m ruff check src tests scripts

      - name: Format check (ruff)
        run: uv run python -m ruff format --check src tests scripts

      - name: Type check (mypy)
        run: uv run python -m mypy src

      - name: Run tests
        run: uv run python -m pytest tests/ -v

  # ── 2. Build once, smoke-test the built wheel, upload as an artifact ─────────
  build:
    name: Build and smoke-test package
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.number }}

    steps:
      - uses: actions/checkout@v4

      - name: Resolve release version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="${INPUT_VERSION#mcp-}"
          VERSION="${VERSION#v}"

          if ! [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "Invalid MCP release version: ${VERSION}" >&2
            exit 1
          fi

          echo "number=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved MCP release version: ${VERSION}"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel and sdist
        working-directory: mcp
        run: uv build
        env:
          # The version comes from the workflow input, not from git tags, so the
          # build is reproducible regardless of which tags exist.
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ steps.version.outputs.number }}

      - name: Check package metadata
        working-directory: mcp
        run: uvx twine check --strict dist/*

      # Install the wheel into an empty virtualenv WITHOUT the lockfile, so the
      # dependencies are resolved fresh - exactly what `uvx gammaledger-mcp`
      # does for users - then talk to it over stdio like an MCP client would.
      - name: Smoke-test the built wheel in a clean environment
        run: |
          set -euo pipefail
          WHEEL="$(ls mcp/dist/*.whl)"
          # PEP 440 may normalise the input (1.2.3-rc1 -> 1.2.3rc1); the wheel name is authoritative.
          BUILT_VERSION="$(basename "${WHEEL}" | cut -d- -f2)"
          uv venv "$RUNNER_TEMP/smoke"
          uv pip install --python "$RUNNER_TEMP/smoke/bin/python" "${WHEEL}"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/smoke/bin/python" "$GITHUB_WORKSPACE/mcp/scripts/smoke_installed.py" \
            --expect-version "${BUILT_VERSION}"

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: mcp-dist
          path: mcp/dist/
          if-no-files-found: error

  # ── 3. Publish the exact artifact that was tested ────────────────────────────
  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write   # required for OIDC trusted publishing
      contents: read

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: mcp-dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true   # safe re-run on transient failures

  # ── 4. Create GitHub Release ─────────────────────────────────────────────────
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: publish-pypi
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="${INPUT_VERSION#mcp-}"
          VERSION="${VERSION#v}"

          if ! [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "Invalid MCP release version: ${VERSION}" >&2
            exit 1
          fi

          echo "number=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=mcp-${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved MCP release version: ${VERSION}"

      - name: Build release body
        id: body
        env:
          RELEASE_NOTES: ${{ inputs.release_notes }}
          VERSION: ${{ steps.version.outputs.number }}
          TAG: ${{ steps.version.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BODY_FILE="$(mktemp)"

          # ── 1. What's Changed (GitHub auto-generated, mcp- tags only) ──────
          PREV_TAG="$(git tag --list 'mcp-*' | grep -vE "^${TAG}$" | sort -V | tail -n 1 || true)"
          if [ -n "${PREV_TAG}" ]; then
            GH_NOTES="$(gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -X POST \
              -f "tag_name=${TAG}" \
              -f "previous_tag_name=${PREV_TAG}" \
              -f "target_commitish=${GITHUB_SHA}" \
              --jq '.body' 2>/dev/null || true)"
          else
            GH_NOTES="$(gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -X POST \
              -f "tag_name=${TAG}" \
              -f "target_commitish=${GITHUB_SHA}" \
              --jq '.body' 2>/dev/null || true)"
          fi
          if [ -n "${GH_NOTES}" ]; then
            printf '%s\n\n' "${GH_NOTES}" >> "${BODY_FILE}"
          fi

          # Optional hand-written notes (appended after What's Changed)
          if [ -n "${RELEASE_NOTES}" ]; then
            printf '%s\n\n' "${RELEASE_NOTES}" >> "${BODY_FILE}"
          fi

          # ── 2. Release Summary ─────────────────────────────────────────────
          cat >> "${BODY_FILE}" <<EOF
          ## GammaLedger MCP v${VERSION}

          | Registry | Package |
          |---|---|
          | PyPI | [\`gammaledger-mcp==${VERSION}\`](https://pypi.org/project/gammaledger-mcp/${VERSION}/) |

          ## Local Installation

          \`\`\`bash
          # pip
          pip install gammaledger-mcp==${VERSION}

          # uvx (recommended - no install needed)
          uvx gammaledger-mcp@${VERSION} --db-path ~/gammaledger.json

          # remote database (set GAMMALEDGER_DB_TOKEN for a bearer token)
          uvx gammaledger-mcp@${VERSION} --db-url https://example.com/gammaledger.json

          # Claude Code
          claude mcp add gammaledger -- uvx gammaledger-mcp --db-path ~/gammaledger.json
          \`\`\`
          EOF

          echo "path=${BODY_FILE}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body_path: ${{ steps.body.outputs.path }}
          generate_release_notes: false
          target_commitish: ${{ github.sha }}
